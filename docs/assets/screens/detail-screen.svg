<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Mockup pantalla DETALLE con METAR, PolyTEMP y Trader Mode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1429"/>
      <stop offset="1" stop-color="#13264e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="30" y="54" font-family="Segoe UI, Arial" font-size="42" fill="#ffffff" font-weight="700">London</text>
  <text x="1110" y="54" font-family="Segoe UI, Arial" font-size="28" fill="#8fc8ff">↻</text>

  <rect x="30" y="78" width="1140" height="216" rx="10" fill="#102043" stroke="#355b95"/>
  <text x="46" y="110" font-family="Segoe UI, Arial" font-size="26" fill="#dce9ff">METAR (EGLC)</text>
  <g font-family="Segoe UI, Arial" font-size="24" fill="#dce9ff">
    <text x="46" y="148">Hora local</text><text x="400" y="148" fill="#a9b9dd">13:04</text>
    <text x="46" y="180">METAR actual</text><text x="400" y="180">8.0°C (19-02-2026 13:00)</text>
