    <text x="46" y="244">Temp estación control</text><text x="400" y="244">8.0°C (46.4°F)</text>
    <text x="46" y="276" fill="#39d98a" font-weight="700">PolyTEMP</text><text x="400" y="276" fill="#39d98a" font-weight="700">9.1°C (48.4°F)</text>
  </g>

  <rect x="30" y="312" width="1140" height="120" rx="10" fill="#101f3f" stroke="#2f5f9a"/>
  <text x="46" y="346" font-family="Segoe UI, Arial" font-size="30" fill="#8fc8ff">Trader Mode</text>
  <text x="46" y="380" font-family="Segoe UI, Arial" font-size="24" fill="#dce9ff">Top ejecutable (Hoy): UNDER • NO 5.7% • BET</text>
  <text x="46" y="412" font-family="Segoe UI, Arial" font-size="20" fill="#a8b8dd">Bruto 9.1% • Costes 2.2% • Fill 0.81</text>

  <rect x="30" y="446" width="1140" height="222" rx="10" fill="#0f1d3a" stroke="#375d98"/>
  <text x="46" y="480" font-family="Segoe UI, Arial" font-size="22" fill="#ffffff">Will the highest temperature in London be 8°C on February 19?</text>
  <text x="46" y="515" font-family="Segoe UI, Arial" font-size="24" fill="#39d98a">UNDER • NO • VERDE • BET</text>
  <text x="46" y="548" font-family="Segoe UI, Arial" font-size="20" fill="#c7d8ff">Exec 5.7% · Bruto 9.1% · Costes 2.2%</text>
  <text x="46" y="576" font-family="Segoe UI, Arial" font-size="20" fill="#c7d8ff">Fill 81% · Post-coste 6.9% · Fee 0.9%</text>
  <text x="46" y="604" font-family="Segoe UI, Arial" font-size="20" fill="#c7d8ff">Model YES 36.0% · Mkt YES 30.3% · Liq 4100 · Spread 0.01</text>
